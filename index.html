<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Purple</title>
    <style>
        /* Ensure body and html occupy full height */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000; /* black background to match video aspect */
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* maintain aspect ratio while covering the container */
            min-width: 100%;
            min-height: 100%;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video src="DP_video.mp4" autoplay loop muted playsinline controls></video>
    </div>
</body>
</html>
